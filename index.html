<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let links = [];

let selectedCategory = "همه";


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value){

    return String(value ?? "")

        .replace(/^\uFEFF/, "")

        .replace(/[\u200B-\u200F\uFEFF]/g, "")

        .replace(/ي/g, "ی")

        .replace(/ى/g, "ی")

        .replace(/ك/g, "ک")

        .replace(/ة/g, "ه")

        .replace(/\u200C/g, "")

        .replace(/ـ/g, "")

        .replace(/[\s\u00A0]+/g, "")

        .trim()

        .toLowerCase();

}


/* =========================================================
   SEARCH NORMALIZE
========================================================= */

function searchable(value){

    return String(value ?? "")

        .replace(/^\uFEFF/, "")

        .replace(/[\u200B-\u200F\uFEFF]/g, "")

        .replace(/ي/g, "ی")

        .replace(/ى/g, "ی")

        .replace(/ك/g, "ک")

        .replace(/ة/g, "ه")

        .replace(/\u200C/g, "")

        .replace(/ـ/g, "")

        .replace(
            /[\s\u00A0]+/g,
            " "
        )

        .trim()

        .toLowerCase();

}


/* =========================================================
   CLEAN
========================================================= */

function clean(value){

    return String(value ?? "")

        .replace(/^\uFEFF/, "")

        .replace(/[\u200B-\u200F\uFEFF]/g, "")

        .trim();

}


/* =========================================================
   CATEGORY NAME
========================================================= */

function categoryName(value){

    const n = normalize(value);


    if(
        n === "بانک" ||
        n === "بانکها" ||
        n === "بانک‌ها"
    ){

        return "بانک‌ها";

    }


    if(n === "دولتی"){

        return "دولتی";

    }


    if(n === "بیمه"){

        return "بیمه";

    }


    if(
        n === "مالیاتی" ||
        n === "مالیات"
    ){

        return "مالیاتی";

    }


    if(n === "سامانههایسازمانی"){

        return "سامانه‌های سازمانی";

    }


    if(n === "خدماتعمومی"){

        return "خدمات عمومی";

    }


    if(
        n === "متفرقه" ||
        n === "متفرق"
    ){

        return "متفرقه";

    }


    return clean(value);

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text){

    const rows = [];

    let row = [];

    let cell = "";

    let quoted = false;


    for(
        let i=0;
        i<text.length;
        i++
    ){

        const ch = text[i];

        const next = text[i+1];


        if(ch === '"'){

            if(
                quoted &&
                next === '"'
            ){

                cell += '"';

                i++;

            }

            else{

                quoted = !quoted;

            }

        }

        else if(
            ch === "," &&
            !quoted
        ){

            row.push(cell);

            cell = "";

        }

        else if(

            (
                ch === "\n" ||
                ch === "\r"
            )

            &&

            !quoted

        ){

            if(
                ch === "\r" &&
                next === "\n"
            ){

                i++;

            }


            row.push(cell);

            cell = "";


            if(
                row.some(
                    x =>
                    String(x).trim() !== ""
                )
            ){

                rows.push(row);

            }


            row = [];

        }

        else{

            cell += ch;

        }

    }


    if(
        cell !== "" ||
        row.length
    ){

        row.push(cell);


        if(
            row.some(
                x =>
                String(x).trim() !== ""
            )
        ){

            rows.push(row);

        }

    }


    return rows;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function esc(value){

    return String(
        value ?? ""
    ).replace(

        /[&<>"']/g,

        function(m){

            return {

                "&":"&amp;",

                "<":"&lt;",

                ">":"&gt;",

                '"':"&quot;",

                "'":"&#039;"

            }[m];

        }

    );

}


/* =========================================================
   CATEGORY BUTTONS
========================================================= */

function renderCategories(){

    const categories = [];

    const seen = new Set();


    /*
       همیشه «همه» اول باشد
    */

    categories.push("همه");


    links.forEach(function(item){

        const cat =
            categoryName(
                item.category
            );


        if(!cat){
            return;
        }


        const key =
            normalize(cat);


        if(
            !seen.has(key)
        ){

            seen.add(key);

            categories.push(cat);

        }

    });


    const container =
        document.getElementById(
            "cats"
        );


    container.innerHTML = "";


    categories.forEach(function(cat){

        const button =
            document.createElement(
                "button"
            );


        button.type = "button";


        button.className = "cat";


        /*
           دسته فعال
        */

        if(
            normalize(cat) ===
            normalize(selectedCategory)
        ){

            button.classList.add(
                "active"
            );

        }


        /*
           فقط نام دسته
           بدون تعداد لینک
        */

        button.textContent = cat;


        /*
           کلیک
        */

        button.addEventListener(
            "click",
            function(){

                selectedCategory = cat;

                renderCategories();

                render();

            }
        );


        container.appendChild(
            button
        );

    });

}


/* =========================================================
   SMART SEARCH + CATEGORY FILTER
========================================================= */

function render(){

    const searchInput =
        document.getElementById(
            "search"
        );


    const query =
        searchable(
            searchInput.value
        );


    const selected =
        normalize(
            selectedCategory
        );


    const filtered =
        links.filter(
            function(item){

                /*
                   دسته‌بندی
                */

                const itemCategory =
                    normalize(
                        categoryName(
                            item.category
                        )
                    );


                const categoryOK =

                    selected === "همه"

                    ||

                    itemCategory === selected;


                /*
                   متن کامل قابل جستجو
                */

                const searchableText =
                    searchable(

                        item.name

                        + " "

                        + item.url

                        + " "

                        + item.category

                        + " "

                        + item.description

                    );


                let searchOK = true;


                /*
                   جستجوی هوشمند
                */

                if(query !== ""){

                    const searchWords =
                        query
                            .split(" ")
                            .filter(Boolean);


                    /*
                       تمام کلمات جستجو
                       باید پیدا شوند
                    */

                    searchOK =
                        searchWords.every(
                            function(word){

                                return searchableText
                                    .includes(word);

                            }
                        );

                }


                return (

                    categoryOK

                    &&

                    searchOK

                );

            }
        );


    /*
       تعداد نتیجه
    */

    document
        .getElementById(
            "status"
        )
        .textContent =

        filtered.length +
        " لینک مجاز";


    const results =
        document.getElementById(
            "results"
        );


    /*
       بدون نتیجه
    */

    if(!filtered.length){

        results.innerHTML =

            '<div class="empty">' +

            'برای جستجوی شما لینکی پیدا نشد.' +

            '</div>';

        return;

    }


    /*
       نمایش لینک‌ها
    */

    results.innerHTML =

        filtered.map(
            function(item){

                return `

                    <a

                        class="card"

                        href="${esc(item.url)}"

                        target="_blank"

                        rel="noopener noreferrer">


                        <div class="title">

                            ${esc(
                                item.name
                            )}

                        </div>


                        <span class="badge">

                            ${esc(
                                categoryName(
                                    item.category
                                )
                            )}

                        </span>


                        <div class="desc">

                            ${esc(
                                item.description
                                || ""
                            )}

                        </div>


                        <div class="url">

                            ${esc(
                                item.url
                            )}

                        </div>


                    </a>

                `;

            }

        ).join("");

}


/* =========================================================
   LOAD CSV
========================================================= */

async function load(){

    try{

        const response =
            await fetch(

                "Links.csv?ts=" +
                Date.now(),

                {
                    cache:"no-store"
                }

            );


        if(!response.ok){

            throw new Error(
                "فایل Links.csv پیدا نشد."
            );

        }


        const buffer =
            await response.arrayBuffer();


        const text =
            new TextDecoder(
                "utf-8"
            )

            .decode(buffer)

            .replace(
                /^\uFEFF/,
                ""
            );


        const rows =
            parseCSV(text);


        if(!rows.length){

            throw new Error(
                "فایل Links.csv خالی است."
            );

        }


        /*
           Header
        */

        const headers =
            rows[0].map(
                function(header){

                    return normalize(
                        header
                    );

                }
            );


        /*
           پیدا کردن ستون
        */

        function column(names){

            for(
                let i=0;
                i<names.length;
                i++
            ){

                const index =
                    headers.indexOf(
                        normalize(
                            names[i]
                        )
                    );


                if(index !== -1){

                    return index;

                }

            }


            return -1;

        }


        const nameIndex =
            column([

                "نام سایت",

                "نام‌سایت",

                "نام"

            ]);


        const urlIndex =
            column([

                "آدرس",

                "آدرس سایت",

                "لینک",

                "url"

            ]);


        const categoryIndex =
            column([

                "دسته‌بندی",

                "دسته بندی",

                "دسته"

            ]);


        const statusIndex =
            column([

                "وضعیت",

                "status"

            ]);


        const descriptionIndex =
            column([

                "توضیحات",

                "توضیح",

                "description"

            ]);


        /*
           بررسی ستون‌ها
        */

        if(nameIndex === -1){

            throw new Error(
                "ستون «نام سایت» پیدا نشد."
            );

        }


        if(urlIndex === -1){

            throw new Error(
                "ستون «آدرس» پیدا نشد."
            );

        }


        if(categoryIndex === -1){

            throw new Error(
                "ستون «دسته‌بندی» پیدا نشد."
            );

        }


        if(statusIndex === -1){

            throw new Error(
                "ستون «وضعیت» پیدا نشد."
            );

        }


        /*
           تبدیل CSV به Object
        */

        links = rows

            .slice(1)

            .map(
                function(row){

                    return {

                        name:
                            clean(
                                row[
                                    nameIndex
                                ]
                            ),


                        url:
                            clean(
                                row[
                                    urlIndex
                                ]
                            ),


                        category:
                            categoryName(
                                row[
                                    categoryIndex
                                ]
                            ),


                        status:
                            clean(
                                row[
                                    statusIndex
                                ]
                            ),


                        description:

                            descriptionIndex !== -1

                            ?

                            clean(
                                row[
                                    descriptionIndex
                                ]
                            )

                            :

                            ""

                    };

                }

            )

            /*
               فقط لینک‌های فعال
            */

            .filter(
                function(item){

                    return (

                        item.name !== ""

                        &&

                        item.url !== ""

                        &&

                        normalize(
                            item.status
                        ) === "فعال"

                    );

                }
            );


        /*
           نمایش
        */

        renderCategories();

        render();

    }


    catch(error){

        console.error(error);


        document
            .getElementById(
                "results"
            )
            .innerHTML =

            '<div class="empty">' +

            esc(
                error.message
            ) +

            '<br><br>' +

            'لطفاً فایل Links.csv را کنار index.html قرار دهید.' +

            '</div>';

    }

}


/* =========================================================
   SEARCH EVENT
========================================================= */

document
    .getElementById(
        "search"
    )
    .addEventListener(
        "input",
        function(){

            render();

        }
    );


/* =========================================================
   START
========================================================= */

load();
