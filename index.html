
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سامانه لینک‌های مجاز | شرکت سازه گستر سایپا</title>
<meta name="description" content="فهرست رسمی سامانه‌ها و وب‌سایت‌های مجاز سازمانی شرکت سازه گستر سایپا">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN TOKENS
========================================================= */
:root{
    --navy-950:#061229;
    --navy-900:#081c3f;
    --navy-800:#0b2350;
    --navy-700:#123a75;
    --navy-600:#1a4c96;

    --steel-600:#1e5fc6;
    --steel-500:#2f74da;
    --steel-300:#7fa8ec;
    --steel-200:#b9cdf1;
    --steel-100:#dde8f8;

    --gold-600:#ab872f;
    --gold-500:#c9a24b;
    --gold-400:#d8b96a;
    --gold-300:#e6d19a;
    --gold-100:#f6edd6;

    --paper:#edf1f7;
    --line:#d9e2ef;
    --ink:#17243f;
    --muted:#64748f;

    --font-body:"Vazirmatn",Tahoma,sans-serif;
    --font-display:"Noto Kufi Arabic","Vazirmatn",Tahoma,sans-serif;
    --font-mono:"JetBrains Mono","Fira Code","Vazirmatn",monospace;
}

/* =========================================================
   RESET
========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100vh;
}

/* blueprint grid background */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background-image:
        linear-gradient(rgba(11,35,80,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(11,35,80,.035) 1px,transparent 1px);
    background-size:34px 34px;
}

/* logo watermark */
body::after{
    content:"";
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:500px;
    height:500px;
    background-image:url('logo.png');
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    opacity:.015;
    filter:grayscale(1) brightness(0);
    pointer-events:none;
    z-index:-1;
}

::selection{
    background:rgba(201,162,75,.42);
    color:var(--navy-900);
}

::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#bcc9dd;border-radius:8px;border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:#9fb0ca}

mark{
    background:rgba(230,209,154,.55);
    color:inherit;
    border-radius:3px;
    padding:0 1px;
}

/* =========================================================
   KEYFRAMES
========================================================= */
@keyframes gold-slide{
    0%{background-position:0% 0}
    100%{background-position:220% 0}
}
@keyframes card-in{
    from{opacity:0;transform:translateY(16px) scale(.985)}
    to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes toast-in{
    from{opacity:0;transform:translate(-50%,16px)}
    to{opacity:1;transform:translate(-50%,0)}
}
@keyframes shimmer{
    from{background-position:200% 0}
    to{background-position:-200% 0}
}
@keyframes float-slow{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-4px)}
}
.animate-card-in{animation:card-in .5s cubic-bezier(.2,.7,.3,1) both}
.animate-toast-in{animation:toast-in .32s cubic-bezier(.2,.7,.3,1) both}
.animate-float-slow{animation:float-slow 4.5s ease-in-out infinite}
.skeleton-shimmer{
    background:linear-gradient(90deg,#e4eaf3 25%,#f2f6fb 50%,#e4eaf3 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s ease infinite;
}

.gold-strip{
    background:linear-gradient(90deg,var(--gold-600),var(--gold-300),var(--gold-500),var(--gold-300),var(--gold-600));
    background-size:220% 100%;
    animation:gold-slide 7s linear infinite;
    border-radius:2px;
    box-shadow:0 2px 16px rgba(201,162,75,.4);
}

.blueprint-grid{
    background-image:
        linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:34px 34px;
}

.hatch-gold{
    background-image:repeating-linear-gradient(45deg,rgba(201,162,75,.16) 0 1px,transparent 1px 10px);
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
    }
}

/* =========================================================
   HEADER
========================================================= */
.header{
    position:relative;
    overflow:hidden;
    color:#fff;
    z-index:50;
}
.header-bg{
    position:absolute;
    inset:0;
    background:
        radial-gradient(1000px 500px at 90% 0%,rgba(47,116,218,.3),transparent 65%),
        radial-gradient(800px 400px at 10% 100%,rgba(201,162,75,.15),transparent 60%),
        radial-gradient(600px 300px at 50% 50%,rgba(30,95,198,.1),transparent 70%),
        linear-gradient(150deg,#061229 0%,#0b2350 45%,#123a75 100%);
}
.header-grid{
    position:absolute;
    inset:0;
    opacity:.4;
    -webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 20%,black 30%,transparent 78%);
    mask-image:radial-gradient(ellipse 90% 80% at 50% 20%,black 30%,transparent 78%);
}
.header-hatch-1{
    position:absolute;
    left:-3rem;
    top:-5rem;
    width:16rem;
    height:16rem;
    border-radius:9999px;
    transform:rotate(12deg);
    filter:blur(2px);
    opacity:.5;
}
.header-hatch-2{
    position:absolute;
    bottom:-6rem;
    right:5%;
    width:14rem;
    height:14rem;
    border-radius:9999px;
    transform:rotate(45deg);
    filter:blur(2px);
    opacity:.5;
}
.header-watermark{
    position:absolute;
    bottom:-6rem;
    left:-4rem;
    width:27.5rem;
    transform:rotate(-12deg);
    opacity:.04;
    pointer-events:none;
    user-select:none;
    display:none;
}
@media(min-width:768px){
    .header-watermark{display:block}
}

.header-inner{
    position:relative;
    z-index:10;
    margin:0 auto;
    padding:2.5rem 1rem 5rem;
    border-radius:0 0 2rem 2rem;
    background:
        radial-gradient(ellipse at 50% 0%,rgba(201,162,75,.08) 0%,transparent 60%),
        radial-gradient(ellipse at 50% 100%,rgba(47,116,218,.06) 0%,transparent 50%);
}
@media(min-width:640px){
    .header-inner{padding:3rem 1.5rem 5rem}
}

.brand-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.5rem;
    text-align:center;
}
@media(min-width:768px){
    .brand-row{
        flex-direction:row;
        align-items:center;
        justify-content:center;
        gap:2rem;
        text-align:center;
    }
}

.brand{
    display:flex;
    align-items:center;
    gap:1.25rem;
}
@media(min-width:640px){
    .brand{gap:1.5rem}
}

.logo-box{
    display:flex;
    align-items:center;
    justify-content:center;
    width:4.625rem;
    height:4.625rem;
    flex-shrink:0;
    padding:.625rem;
    background:#fff;
    border:1px solid rgba(201,162,75,.7);
    border-radius:.875rem;
    box-shadow:
        0 16px 40px rgba(2,10,26,.5),
        0 0 0 1px rgba(255,255,255,.2) inset;
    transition:transform .3s cubic-bezier(.2,.7,.3,1), box-shadow .3s;
}
.logo-box:hover{
    transform:scale(1.06) rotate(1deg);
    box-shadow:
        0 24px 56px rgba(2,10,26,.6),
        0 0 0 1px rgba(201,162,75,.3) inset;
}
@media(min-width:640px){
    .logo-box{width:5rem;height:5rem}
}
.logo-box img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.company-name{
    font-family:var(--font-display);
    font-size:1.75rem;
    font-weight:800;
    line-height:1.4;
    background:linear-gradient(to left,#fff 30%,var(--gold-300) 70%,#fff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    background-size:200% 100%;
    animation:gold-slide 5s linear infinite;
}
@media(min-width:640px){
    .company-name{font-size:2.25rem}
}

.brand-line{
    display:block;
    width:3.5rem;
    height:2px;
    margin-top:.375rem;
    border-radius:9999px;
    background:linear-gradient(to left,var(--gold-500),var(--gold-300));
    box-shadow:0 0 8px var(--gold-500);
}

.company-sub{
    margin-top:.625rem;
    font-size:.75rem;
    font-weight:500;
    color:var(--steel-200);
}
@media(min-width:640px){
    .company-sub{font-size:.8125rem}
}

/* meta */
.meta-box{
    display:none;
    flex-direction:column;
    align-items:flex-end;
    gap:.5rem;
    flex-shrink:0;
}
@media(min-width:768px){
    .meta-box{display:flex}
}

.meta-date{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    color:var(--steel-200);
    font-family:var(--font-mono);
    font-size:1rem;
    font-weight:600;
    padding:.375rem .75rem;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:.75rem;
    backdrop-filter:blur(8px);
    transition:all .2s cubic-bezier(.2,.7,.3,1);
    white-space:nowrap;
}
.meta-date:hover{
    background:rgba(255,255,255,.12);
    border-color:rgba(201,162,75,.3);
    color:var(--gold-300);
    transform:translateY(-1px);
}
.meta-time{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    font-family:var(--font-mono);
    font-size:1rem;
    font-weight:700;
    color:#fff;
    letter-spacing:.06em;
    text-shadow:0 0 16px rgba(216,185,106,.5), 0 2px 8px rgba(2,10,26,.4);
    padding:.375rem .75rem;
    background:linear-gradient(135deg,rgba(201,162,75,.18),rgba(47,116,218,.12));
    border:1px solid rgba(201,162,75,.35);
    border-radius:.75rem;
    backdrop-filter:blur(8px);
    box-shadow:
        0 4px 20px -4px rgba(201,162,75,.25),
        inset 0 1px 0 rgba(255,255,255,.1);
    transition:all .3s cubic-bezier(.2,.7,.3,1);
    white-space:nowrap;
}
.meta-time:hover{
    transform:scale(1.01);
    box-shadow:
        0 6px 28px -4px rgba(201,162,75,.35),
        inset 0 1px 0 rgba(255,255,255,.12);
    border-color:rgba(201,162,75,.5);
}

/* search */
.search-section{
    margin-top:2rem;
    max-width:40rem;
    margin-left:auto;
    margin-right:auto;
    padding:0 1rem;
}
@media(min-width:640px){
    .search-section{padding:0 1.5rem}
}
.search-label{
    display:block;
    margin-bottom:.5rem;
    font-family:var(--font-display);
    font-size:.75rem;
    font-weight:600;
    color:var(--navy-700);
    text-align:center;
}
.search-wrap{
    position:relative;
}
.search-icon{
    position:absolute;
    left:1.25rem;
    top:50%;
    transform:translateY(-50%);
    width:1.25rem;
    height:1.25rem;
    color:var(--navy-700);
    transition:color .2s;
    cursor:pointer;
}
.search-input{
    width:100%;
    height:3.25rem;
    padding:0 3.5rem 0 3.5rem;
    border:1px solid var(--line);
    border-radius:1.5rem;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    font-size:.9375rem;
    font-weight:500;
    box-shadow:
        0 2px 12px -2px rgba(8,28,63,.08),
        0 0 0 1px rgba(255,255,255,.5) inset;
    outline:none;
    transition:all .25s cubic-bezier(.2,.7,.3,1);
}
.search-input::placeholder{color:rgba(100,116,143,.7); font-weight:400}
.search-input:focus{
    border-color:var(--steel-500);
    box-shadow:
        0 4px 20px -4px rgba(30,95,198,.15),
        0 0 0 3px rgba(47,116,218,.15),
        0 0 0 1px rgba(255,255,255,.5) inset;
}
.search-input:focus ~ .search-icon{color:var(--steel-600)}

.search-clear{
    position:absolute;
    right:.75rem;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    width:2.25rem;
    height:2.25rem;
    border:none;
    border-radius:.5rem;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    transition:all .15s;
    z-index:2;
}
.search-clear:hover{
    background:var(--paper);
    color:var(--navy-800);
    transform:translateY(-50%) scale(1.1);
}

/* =========================================================
   MAIN
========================================================= */
.main{
    position:relative;
    z-index:20;
    margin:-3rem auto 0;
    padding:0 1rem 3rem;
}
@media(min-width:640px){
    .main{padding:0 1.5rem 3rem}
}

/* category bar */
.toolbar-wrap{
    position:sticky;
    top:1.5rem;
    z-index:30;
    margin-top:2.5rem;
}
.toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:.5rem;
    padding:.75rem 1rem;
    background:rgba(255,255,255,.98);
    border:1px solid var(--line);
    border-radius:1rem;
    box-shadow:
        0 12px 40px -16px rgba(8,28,63,.2),
        0 0 0 1px rgba(255,255,255,.7) inset;
    backdrop-filter:blur(20px);
    position:relative;
    z-index:40;
}
.cat-btn{
    display:inline-flex;
    align-items:center;
    gap:.375rem;
    padding:.5rem 1.125rem;
    border:1px solid transparent;
    border-radius:.625rem;
    background:transparent;
    color:var(--muted);
    font-family:inherit;
    font-size:.8125rem;
    font-weight:600;
    cursor:pointer;
    transition:all .2s cubic-bezier(.2,.7,.3,1);
    user-select:none;
    position:relative;
    z-index:1;
}
.cat-btn:hover{
    transform:translateY(-2px);
    background:rgba(30,95,198,.1);
    color:var(--navy-700);
    border-color:rgba(30,95,198,.2);
    box-shadow:0 8px 24px -8px rgba(30,95,198,.3);
}
.cat-btn.active{
    background:linear-gradient(135deg,var(--navy-800),var(--navy-700));
    border-color:var(--navy-700);
    color:#fff;
    box-shadow:
        0 8px 24px -8px rgba(8,28,63,.6),
        0 0 0 1px rgba(255,255,255,.15) inset;
}
    box-shadow:
        0 8px 24px -8px rgba(8,28,63,.6),
        0 0 0 1px rgba(255,255,255,.1) inset;
}

/* status row */
.status-row{
    margin-top:1.25rem;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:.5rem;
    padding:.75rem 1rem;
    background:rgba(255,255,255,.95);
    border:1px solid var(--line);
    border-radius:.75rem;
    backdrop-filter:blur(12px);
    box-shadow:
        0 8px 24px -12px rgba(8,28,63,.2),
        0 0 0 1px rgba(255,255,255,.5) inset;
    position:relative;
    z-index:35;
}
.status-text{
    font-size:.8125rem;
    color:var(--muted);
}
.status-text b{
    font-family:var(--font-display);
    font-size:.875rem;
    color:var(--navy-800);
}
.clear-btn{
    display:inline-flex;
    align-items:center;
    gap:.375rem;
    padding:.5rem 1rem;
    border:1px solid var(--line);
    border-radius:.5rem;
    background:#fff;
    color:var(--steel-600);
    font-family:inherit;
    font-size:.75rem;
    font-weight:600;
    cursor:pointer;
    transition:all .2s cubic-bezier(.2,.7,.3,1);
    position:relative;
    z-index:1;
}
.clear-btn:hover{
    transform:translateY(-2px) scale(1.02);
    border-color:var(--steel-300);
    color:var(--navy-800);
    background:rgba(30,95,198,.08);
    box-shadow:
        0 8px 20px -4px rgba(30,95,198,.25),
        0 0 0 1px rgba(255,255,255,.8) inset;
}

/* grid */
.grid{
    margin-top:1rem;
    display:grid;
    grid-template-columns:1fr;
    gap:.75rem;
}
@media(min-width:480px){
    .grid{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:768px){
    .grid{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1024px){
    .grid{grid-template-columns:repeat(4,1fr)}
}
@media(min-width:1280px){
    .grid{grid-template-columns:repeat(5,1fr)}
}
@media(min-width:1536px){
    .grid{grid-template-columns:repeat(6,1fr)}
}

/* card */
.card{
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    padding:.875rem;
    min-height:130px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:.625rem;
    color:inherit;
    text-decoration:none;
    box-shadow:
        0 2px 10px -2px rgba(8,28,63,.05),
        0 0 0 1px rgba(255,255,255,.5) inset;
    transition:all .35s cubic-bezier(.2,.7,.3,1);
}
.card:hover{
    transform:translateY(-6px) scale(1.01);
    border-color:var(--steel-400);
    box-shadow:
        0 24px 48px -16px rgba(8,28,63,.35),
        0 6px 16px -4px rgba(30,95,198,.12),
        0 0 0 1px rgba(255,255,255,.3) inset;
}
.card:focus-visible{
    outline:2px solid var(--steel-500);
    outline-offset:2px;
}

.card-accent{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:3px;
    opacity:.9;
    border-radius:.875rem .875rem 0 0;
    transition:opacity .2s, height .2s;
}
.card:hover .card-accent{
    opacity:1;
    height:4px;
}

.card-glow{
    position:absolute;
    bottom:-5rem;
    right:-5rem;
    width:12rem;
    height:12rem;
    border-radius:9999px;
    opacity:0;
    transition:opacity .4s cubic-bezier(.2,.7,.3,1);
    pointer-events:none;
    animation:float-slow 6s ease-in-out infinite;
}
.card:hover .card-glow{opacity:.15}

.card-top{
    position:relative;
    display:flex;
    align-items:flex-start;
    gap:.875rem;
}
.card-icon{
    display:flex;
    align-items:center;
    justify-content:center;
    width:2.25rem;
    height:2.25rem;
    flex-shrink:0;
    border-radius:.5rem;
    transition:transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s;
    box-shadow:0 4px 16px -4px currentColor;
}
.card:hover .card-icon{
    transform:scale(1.1) rotate(2deg);
    box-shadow:0 8px 24px -4px currentColor;
}
.card-icon svg{width:1.125rem;height:1.125rem}

.card-info{
    flex:1;
    min-width:0;
}
.card-title{
    font-size:.75rem;
    font-weight:800;
    line-height:1.3;
    color:var(--navy-800);
    transition:color .2s;
    word-break:break-word;
    overflow-wrap:anywhere;
}
.card:hover .card-title{color:var(--steel-600)}

.card-badge{
    display:inline-block;
    margin-top:.1875rem;
    padding:.125rem .5rem;
    border-radius:.25rem;
    font-size:.5rem;
    font-weight:700;
    letter-spacing:.01em;
    box-shadow:0 1px 4px -1px currentColor;
}

.card-copy{
    display:flex;
    align-items:center;
    justify_content:center;
    width:2rem;
    height:2rem;
    flex-shrink:0;
    border:1px solid var(--line);
    border-radius:.375rem;
    background:var(--paper);
    color:var(--muted);
    cursor:pointer;
    opacity:0;
    transform:translateX(8px) scale(.9);
    transition:all .2s cubic-bezier(.2,.7,.3,1);
}
.card:hover .card-copy{opacity:1; transform:translateX(0) scale(1)}
.card-copy:hover{
    border-color:var(--steel-300);
    color:var(--steel-600);
    background:#fff;
    transform:translateX(0) scale(1.05);
}
.card-copy.copied{
    opacity:1;
    transform:translateX(0);
    border-color:#6ee7b7;
    background:#ecfdf5;
    color:#059669;
}
.card-copy svg{width:1.125rem;height:1.125rem}

.card-desc{
    position:relative;
    margin-top:.5rem;
    min-height:2.5rem;
    flex:1;
    font-size:.625rem;
    line-height:1.5;
    color:var(--muted);
    word-break:break-word;
    overflow-wrap:anywhere;
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-bottom{

<script>
/* =========================================================
   STATE
========================================================= */
var links = [];
var selectedCategory = "همه";
var query = "";
var toastTimer = null;

/* =========================================================
   TEXT HELPERS
========================================================= */
function normalize(v){
    return String(v||"")
        .replace(/^\uFEFF/,"")
        .replace(/[\u200B-\u200F\uFEFF]/g,"")
        .replace(/ي/g,"ی").replace(/ى/g,"ی").replace(/ك/g,"ک").replace(/ة/g,"ه")
        .replace(/\u200C/g,"").replace(/ـ/g,"")
        .replace(/[\s\u00A0]+/g,"")
        .trim().toLowerCase();
}

function searchable(v){
    return String(v||"")
        .replace(/^\uFEFF/,"")
        .replace(/[\u200B-\u200F\uFEFF]/g,"")
        .replace(/ي/g,"ی").replace(/ى/g,"ی").replace(/ك/g,"ک").replace(/ة/g,"ه")
        .replace(/\u200C/g,"").replace(/ـ/g,"")
        .replace(/[\s\u00A0]+/g," ")
        .trim().toLowerCase();
}

function clean(v){
    return String(v||"").replace(/^\uFEFF/,"").replace(/[\u200B-\u200F\uFEFF]/g,"").trim();
}

function categoryName(v){
    var n = normalize(v);
    if(n==="بانک"||n==="بانکها") return "بانک‌ها";
    if(n==="دولتی") return "دولتی";
    if(n==="بیمه") return "بیمه";
    if(n==="مالیاتی"||n==="مالیات") return "مالیاتی";
    if(n==="سامانههایسازمانی") return "سامانه‌های سازمانی";
    if(n==="خدماتعمومی") return "خدمات عمومی";
    if(n==="متفرقه"||n==="متفرق") return "متفرقه";
    return clean(v);
}

function faDigits(n){ return Number(n).toLocaleString("fa-IR"); }

function displayHost(url){
    try{ return new URL(url).host.replace(/^www\./,""); }
    catch(e){ return url.replace(/^https?:\/\//,"").replace(/\/$/,""); }
}

function esc(s){
    return String(s||"").replace(/[&<>"']/g,function(m){
        return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m];
    });
}

/* =========================================================
   CSV PARSER
========================================================= */
function parseCSV(text){
    var rows=[], row=[], cell="", quoted=false;
    for(var i=0;i<text.length;i++){
        var ch=text[i], next=text[i+1];
        if(ch==='"'){
            if(quoted && next==='"'){ cell+='"'; i++; }
            else quoted=!quoted;
        } else if(ch==="," && !quoted){
            row.push(cell); cell="";
        } else if((ch==="\n"||ch==="\r") && !quoted){
            if(ch==="\r" && next==="\n") i++;
            row.push(cell); cell="";
            if(row.some(function(x){return String(x).trim()!==""})) rows.push(row);
            row=[];
        } else cell+=ch;
    }
    if(cell!==""||row.length){
        row.push(cell);
        if(row.some(function(x){return String(x).trim()!==""})) rows.push(row);
    }
    return rows;
}

/* =========================================================
   CATEGORY VISUAL
========================================================= */
var CAT_VISUALS = {
    "بانک":  {color:"#0d7a64", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5 12 4l8.5 5.5"/><path d="M5.5 10v7M10 10v7M14 10v7M18.5 10v7"/><path d="M3.5 20.5h17M3 17.5h18"/></svg>'},
    "مالیات":{color:"#a05a2c", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v4h4"/><path d="m9.8 15.5 4.4-5.5"/><circle cx="9.7" cy="10.3" r=".9"/><circle cx="14.3" cy="15.2" r=".9"/></svg>'},
    "بیمه": {color:"#a67c1f", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 2.8v5.4c0 4.5-3 8.1-7 9.8-4-1.7-7-5.3-7-9.8V5.8L12 3Z"/><path d="m9 12 2 2 4-4"/></svg>'},
    "دولت": {color:"#2f5da8", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 21h15"/><path d="M6 21V9.5h12V21"/><path d="M9.5 21v-4.5a2.5 2.5 0 0 1 5 0V21"/><path d="M12 9.5V5"/></svg>'},
    "خدمات":{color:"#4f7d3c", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"/></svg>'},
    "سازمانی":{color:"#1e5fc6", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7.8 12 3 3 7.8v8.4L12 21l9-4.8V7.8Z"/><path d="m3 7.8 9 4.7 9-4.7"/><path d="M12 12.5V21"/></svg>'}
};
var CAT_DEFAULT = {color:"#5b6b84", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3.5 3 8v8l9 4.5L21 16V8Z"/><path d="m3 8 9 4.5L21 8"/><path d="M12 12.5V20.5"/></svg>'};

function catVisual(cat){
    var n = normalize(cat);
    for(var key in CAT_VISUALS){
        if(n.indexOf(normalize(key))!==-1) return CAT_VISUALS[key];
    }
    return CAT_DEFAULT;
}

/* =========================================================
   HIGHLIGHT
========================================================= */
function highlight(text, words){
    if(!text) return text;
    if(!words.length) return esc(text);
    var parts = [];
    var remaining = text;
    words.forEach(function(w){
        if(!w) return;
        var escaped = w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
        var tolerant = Array.from(escaped).map(function(ch){
            return ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
        }).join("[\\u200B-\\u200F\\uFEFF\\s]*");
        try{
            var re = new RegExp("("+tolerant+")","gi");
            var segs = remaining.split(re);
            var newParts = [];
            segs.forEach(function(seg,i){
                if(i%2===1){
                    newParts.push("<mark>"+esc(seg)+"</mark>");
                } else {
                    newParts.push(esc(seg));
                }
            });
            remaining = newParts.join("§§§");
        } catch(e){}
    });
    return remaining.replace(/§§§/g,"");
}

/* =========================================================
   COPY
========================================================= */
function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
        return navigator.clipboard.writeText(text).then(function(){return true}).catch(function(){return fallbackCopy(text)});
    }
    return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
    try{
        var ta=document.createElement("textarea");
        ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.select();
        var ok=document.execCommand("copy");
        ta.remove(); return ok;
    }catch(e){return false}
}

/* =========================================================
   TOAST
========================================================= */
function showToast(msg){
    var el=document.getElementById("toast");
    document.getElementById("toastMsg").textContent=msg;
    el.style.display="flex";
    el.classList.remove("animate-toast-in");
    void el.offsetWidth;
    el.classList.add("animate-toast-in");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){el.style.display="none"},2400);
}

/* =========================================================
   CLOCK
========================================================= */
function updateClock(){
    var now=new Date();
    document.getElementById("metaDate").innerHTML=
        '<svg style="width:1rem;height:1rem;color:var(--gold-400)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg> '+
        new Intl.DateTimeFormat("fa-IR",{day:"numeric",month:"long",year:"numeric"}).format(now);
    
    var timeStr=new Intl.DateTimeFormat("fa-IR",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(now);
    document.getElementById("metaTime").innerHTML=
        '<svg style="width:1rem;height:1rem;color:var(--gold-400)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg> '+
        timeStr;
}

/* =========================================================
   RENDER
========================================================= */
function getWords(){
    var q=searchable(query);
    return q ? q.split(" ").filter(Boolean) : [];
}

function getFiltered(){
    var words=getWords();
    var sel=normalize(selectedCategory);
    return links.filter(function(item){
        var catOK = sel==="همه" || normalize(item.category)===sel;
        if(!catOK) return false;
        if(!words.length) return true;
        var hay=searchable(item.name+" "+item.url+" "+item.category+" "+item.description);
        return words.every(function(w){return hay.indexOf(w)!==-1});
    });
}

function getCategories(){
    var list=[], seen={};
    links.forEach(function(item){
        var key=normalize(item.category);
        if(!key) return;
        if(!seen[key]){
            seen[key]=true;
            list.push({name:item.category,count:1});
        } else {
            for(var i=0;i<list.length;i++){
                if(normalize(list[i].name)===key){list[i].count++;break}
            }
        }
    });
    list.sort(function(a,b){return b.count-a.count});
    return [{name:"همه",count:links.length}].concat(list);
}

function renderCategories(){
    var cats=getCategories();
    var toolbar=document.getElementById("toolbar");
    toolbar.innerHTML="";
    cats.forEach(function(cat){
        var btn=document.createElement("button");
        btn.type="button";
        btn.className="cat-btn"+(normalize(cat.name)===normalize(selectedCategory)?" active":"");
        btn.innerHTML=esc(cat.name);
        btn.addEventListener("click",function(){
            selectedCategory=cat.name;
            renderCategories();
            render();
        });
        toolbar.appendChild(btn);
    });

    /* footer quick links */
    var fl=document.getElementById("footerLinks");
    fl.innerHTML="";
    cats.filter(function(c){return c.name!=="همه"}).forEach(function(cat){
        var li=document.createElement("li");
        var btn=document.createElement("button");
        btn.type="button";
        btn.className="footer-link";
        btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg> '+esc(cat.name);
        btn.addEventListener("click",function(){
            selectedCategory=cat.name;
            renderCategories();
            render();
            window.scrollTo({top:0,behavior:"smooth"});
        });
        li.appendChild(btn);
        fl.appendChild(li);
    });
}

        html+='<div class="skel-card animate-card-in" style="animation-delay:'+i*45+'ms">'+
            '<div class="skel-row">'+
            '<div class="skel-icon skeleton-shimmer"></div>'+
            '<div style="flex:1;padding-top:.25rem">'+
            '<div class="skel-line skeleton-shimmer" style="width:75%;margin-bottom:.5rem"></div>'+
            '<div class="skel-line-sm skeleton-shimmer" style="width:33%"></div>'+
            '</div></div>'+
            '<div style="margin-top:1rem">'+
            '<div class="skel-line-sm skeleton-shimmer" style="width:100%;margin-bottom:.5rem"></div>'+
            '<div class="skel-line-sm skeleton-shimmer" style="width:66%"></div>'+
            '</div>'+
            '<div class="skeleton-shimmer" style="margin-top:1rem;height:1px"></div>'+
            '<div class="skel-line-sm skeleton-shimmer" style="margin-top:.875rem;width:50%"></div>'+

        '<button class="action-btn" onclick="resetFilters()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.9-6.6"/><path d="M21 3v5.5h-5.5"/></svg> حذف فیلترها و جستجو</button>'+

function renderError(msg){
    document.getElementById("grid").innerHTML=
        '<div class="error-box animate-card-in">'+
        '<svg style="width:3rem;height:3rem;color:#f87171" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4.1 2.9 17a2 2 0 0 0 1.7 3h14.8a2 2 0 0 0 1.7-3L13.7 4.1a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4.5M12 17h.01"/></svg>'+
        '<h3>خطا در دریافت فهرست لینک‌ها</h3>'+
        '<p>'+esc(msg)+'<br>لطفاً مطمئن شوید فایل <b>Links.csv</b> کنار صفحه قرار دارد و ارتباط شبکه برقرار است.</p>'+
        '<button class="action-btn" onclick="loadData()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.9-6.6"/><path d="M21 3v5.5h-5.5"/></svg> تلاش دوباره</button>'+
        '</div>';

function render(){
    var filtered=getFiltered();
    var words=getWords();
    var hasFilters = words.length>0 || normalize(selectedCategory)!=="همه";

    /* status row */
    var statusRow=document.getElementById("statusRow");
    statusRow.style.display=hasFilters?"flex":"none";
    document.getElementById("statusText").innerHTML=
        'نمایش <b>'+faDigits(filtered.length)+'</b> از '+faDigits(links.length)+' لینک مجاز';
    document.getElementById("clearBtn").style.display=hasFilters?"inline-flex":"none";

    /* grid */
    var grid=document.getElementById("grid");
    if(!filtered.length){
        renderEmpty();
        return;
    }

    var html="";
    filtered.forEach(function(item,i){
        var vis=catVisual(item.category);
        var delay=Math.min(i,14)*40;
        html+='<a class="card animate-card-in" href="'+esc(item.url)+'" target="_blank" rel="noopener noreferrer" style="animation-delay:'+delay+'ms">'+
            '<span class="card-accent" style="background:linear-gradient(to left,'+vis.color+','+vis.color+' 55%,var(--gold-500))"></span>'+
            '<span class="card-glow" style="background:radial-gradient(circle,'+vis.color+'22,transparent 70%)"></span>'+
            '<div class="card-top">'+
                '<span class="card-icon" style="background:'+vis.color+'14;color:'+vis.color+'">'+vis.icon+'</span>'+
                '<div class="card-info">'+
                    '<h3 class="card-title">'+highlight(item.name,words)+'</h3>'+
                    '<span class="card-badge" style="background:'+vis.color+'1a;color:'+vis.color+'">'+esc(item.category)+'</span>'+
                '</div>'+
                '<button type="button" class="card-copy" data-url="'+esc(item.url)+'" aria-label="کپی آدرس سامانه" title="کپی آدرس">'+
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'+
                '</button>'+
            '</div>'+
            '<p class="card-desc">'+(item.description?highlight(item.description,words):'بدون توضیحات')+'</p>'+
            '<div class="card-bottom">'+
                '<span class="card-url">'+esc(displayHost(item.url))+'</span>'+
                '<span class="card-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 17 7 7"/><path d="M15.5 7H7v8.5"/></svg></span>'+
            '</div>'+
        '</a>';
    });
    grid.innerHTML=html;

    /* copy buttons */
    grid.querySelectorAll(".card-copy").forEach(function(btn){
        btn.addEventListener("click",function(e){
            e.preventDefault();
            e.stopPropagation();
            var url=btn.getAttribute("data-url");
            copyText(url).then(function(ok){
                if(ok){
                    btn.classList.add("copied");
                    btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>';
                    showToast("آدرس سامانه در حافظه موقت کپی شد");
                    setTimeout(function(){
                        btn.classList.remove("copied");
                        btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
                    },1600);
                } else {
                    showToast("کپی آدرس امکان‌پذیر نشد");
                }
            });
        });
    });

}

function resetFilters(){
    query="";
    selectedCategory="همه";
    document.getElementById("search").value="";
    document.getElementById("searchClear").style.display="none";
    renderCategories();
    render();
}

/* =========================================================
   LOAD CSV
========================================================= */
function loadData(){
    links=[];
    renderSkeleton();
    document.getElementById("statusRow").style.display="none";

    fetch("Links.csv?ts="+Date.now(),{cache:"no-store"})
    .then(function(r){
        if(!r.ok) throw new Error("فایل Links.csv پیدا نشد.");
        return r.arrayBuffer();
    })
    .then(function(buf){
        var text=new TextDecoder("utf-8").decode(buf).replace(/^\uFEFF/,"");
        var rows=parseCSV(text);
        if(!rows.length) throw new Error("فایل Links.csv خالی است.");

        /* detect header row — could be row 0 or row 1 (if Sheet column exists) */
        var headerRow=rows[0];
        var headers=headerRow.map(function(h){return normalize(h)});

        function col(names){
            for(var i=0;i<names.length;i++){
                var idx=headers.indexOf(normalize(names[i]));
                if(idx!==-1) return idx;
            }
            return -1;
        }

        var nameIdx=col(["نام سایت","نام‌سایت","نام"]);
        var urlIdx=col(["آدرس","آدرس سایت","لینک","url"]);
        var catIdx=col(["دسته‌بندی","دسته بندی","دسته"]);
        var statusIdx=col(["وضعیت","status"]);
        var descIdx=col(["توضیحات","توضیح","description"]);

        if(nameIdx===-1) throw new Error("ستون «نام سایت» پیدا نشد.");
        if(urlIdx===-1) throw new Error("ستون «آدرس» پیدا نشد.");
        if(catIdx===-1) throw new Error("ستون «دسته‌بندی» پیدا نشد.");
        if(statusIdx===-1) throw new Error("ستون «وضعیت» پیدا نشد.");

        links=rows.slice(1).map(function(row){
            return {
                name:clean(row[nameIdx]),
                url:clean(row[urlIdx]),
                category:categoryName(row[catIdx]),
                status:clean(row[statusIdx]),
                description:descIdx!==-1?clean(row[descIdx]):""
            };
        }).filter(function(item){
            /* skip metadata rows like "دسته‌بندی‌ها" and "راهنما" */
            var firstCol=normalize(row_name(item));
            if(firstCol==="دسته‌بندی‌ها"||firstCol==="دسته بندی‌ها"||firstCol==="راهنما") return false;
            return item.name!=="" && item.url!=="" && normalize(item.status)==="فعال";
        });

        /* also filter out rows where name is actually a sheet/category label */
        links=links.filter(function(item){
            var n=normalize(item.name);
            return n!=="دسته‌بندی‌ها" && n!=="راهنما" && n!=="links";
        });

        /* render */
        renderCategories();
        render();
    })
    .catch(function(err){
        console.error(err);
        renderError(err.message||"خطای نامشخص");
    });
}

/* helper to get first column value for metadata filtering */
var _rawRows=[];
function row_name(item){ return item.name; }

/* =========================================================
   EVENTS
========================================================= */
var searchInput=document.getElementById("search");
var searchClear=document.getElementById("searchClear");
var searchIcon=document.getElementById("searchIcon");

searchInput.addEventListener("input",function(){
    query=searchInput.value;
    searchClear.style.display=query?"flex":"none";
    render();
});

searchInput.addEventListener("keydown",function(e){
    if(e.key==="Escape"){
        query="";
        searchInput.value="";
        searchClear.style.display="none";
        searchInput.blur();
        render();
    }
});

searchIcon.addEventListener("click",function(){
    searchInput.focus();
});

searchClear.addEventListener("click",function(){
    query="";
    searchInput.value="";
    searchClear.style.display="none";
    searchInput.focus();
    render();
});

document.getElementById("clearBtn").addEventListener("click",resetFilters);

/* "/" shortcut */
document.addEventListener("keydown",function(e){
    var tag=(e.target.tagName||"").toLowerCase();
    if(e.key==="/" && tag!=="input" && tag!=="textarea"){
        e.preventDefault();
        searchInput.focus();
    }
});

/* clock */
updateClock();
setInterval(updateClock,1000);

/* start */
loadData();
</script>
